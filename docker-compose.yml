services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pushup_dev
    ports:
      - "5432:5432"
    volumes:
      - pushup_pg_data:/var/lib/postgresql/data

volumes:
  pushup_pg_data:
